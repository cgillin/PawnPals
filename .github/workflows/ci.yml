# CI for PittChess. Runs on every pull request and on pushes to main.
#
# The job names below ("Lint", "Build & test", "Tests required") are the status
# checks the main-branch ruleset requires. If you rename a job, update the
# ruleset too, or PRs will wait forever for a check that never reports.
#
# Only "Build & test" runs on macOS (the xcode-27 image). Free macOS runners are shared and can queue
# for minutes, so everything that doesn't need a Mac runs on Linux instead.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# A new push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Pinned to the same Swift version as our Xcode, so swift-format behaves
    # identically in CI and locally. Bump this when we update Xcode.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: swift-format lint
        run: |
          swift --version
          files=$(find . -name '*.swift' -not -path './.build/*' -not -path '*/.build/*')
          if [ -z "$files" ]; then
            echo "No Swift files yet; nothing to lint."
            exit 0
          fi
          echo "$files" | xargs swift format lint --strict --configuration .swift-format

  build-and-test:
    name: Build & test
    # Xcode 27 is needed to open our project format (project.xcproj). GitHub keys
    # Mac images by Xcode version, so bump this label when we move to a new Xcode.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: .github/scripts/select-xcode.sh

      # Stockfish's neural networks (78 MB) aren't in git. Keep them between runs,
      # so CI only downloads them when the cache is empty or the networks change.
      # The key comes from the fetch script, which lists each file's fingerprint.
      - name: Restore Stockfish networks from the cache
        uses: actions/cache@v4
        with:
          path: PittChessCore/Sources/PittChessCore/Engine/Networks/*.nnue
          key: stockfish-networks-${{ hashFiles('scripts/fetch-stockfish-networks.sh') }}

      - name: Fetch Stockfish networks (skips files already here)
        run: scripts/fetch-stockfish-networks.sh

      - name: Core tests (swift test on PittChessCore)
        run: |
          if [ ! -f PittChessCore/Package.swift ]; then
            echo "PittChessCore doesn't exist yet; skipping."
            exit 0
          fi
          swift test --package-path PittChessCore

      - name: App build & test (xcodebuild on an iPhone simulator)
        run: |
          if [ ! -d PittChess.xcodeproj ]; then
            echo "PittChess.xcodeproj doesn't exist yet; skipping."
            exit 0
          fi
          # Pick the first available iPhone simulator instead of hard-coding a model
          # name, because runner images change which simulators they ship.
          device_id=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$device_id" ] || [ "$device_id" = "null" ]; then
            echo "No iPhone simulator found on this runner." >&2
            exit 1
          fi
          # Boot the simulator and wait until it's fully ready before testing. Otherwise
          # the UI test's first launch also waits for the boot, and on a slow runner that
          # can pass Xcode's launch time limit ("Timed out while launching application").
          xcrun simctl boot "$device_id" || true  # Fine if it's already booted.
          xcrun simctl bootstatus "$device_id" -b
          set -o pipefail
          xcodebuild test \
            -project PittChess.xcodeproj \
            -scheme PittChess \
            -destination "id=$device_id" \
            CODE_SIGNING_ALLOWED=NO

  tests-required:
    name: Tests required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that code changes come with test changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
        run: .github/scripts/check-tests-included.sh
