# CI for PawnPals. Runs on every pull request and on pushes to main.
#
# The job names below ("Lint", "Core tests", "App build & test", "Tests required")
# are the status checks the main-branch ruleset requires. If you rename a job,
# update the ruleset too, or PRs will wait forever for a check that never reports.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# A new push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: .github/scripts/select-xcode.sh

      - name: swift-format lint
        run: |
          files=$(git ls-files '*.swift')
          if [ -z "$files" ]; then
            echo "No Swift files yet; nothing to lint."
            exit 0
          fi
          echo "$files" | xargs swift format lint --strict --configuration .swift-format

  core-tests:
    name: Core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: .github/scripts/select-xcode.sh

      - name: swift test (PawnPalsCore)
        run: |
          if [ ! -f PawnPalsCore/Package.swift ]; then
            echo "PawnPalsCore doesn't exist yet; skipping."
            exit 0
          fi
          swift test --package-path PawnPalsCore

  app:
    name: App build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: .github/scripts/select-xcode.sh

      - name: xcodebuild test (iPhone simulator)
        run: |
          if [ ! -d PawnPals.xcodeproj ]; then
            echo "PawnPals.xcodeproj doesn't exist yet; skipping."
            exit 0
          fi
          # Pick the first available iPhone simulator instead of hard-coding a model
          # name, because runner images change which simulators they ship.
          device_id=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$device_id" ] || [ "$device_id" = "null" ]; then
            echo "No iPhone simulator found on this runner." >&2
            exit 1
          fi
          set -o pipefail
          xcodebuild test \
            -project PawnPals.xcodeproj \
            -scheme PawnPals \
            -destination "id=$device_id" \
            CODE_SIGNING_ALLOWED=NO

  tests-required:
    name: Tests required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that code changes come with test changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
        run: .github/scripts/check-tests-included.sh
